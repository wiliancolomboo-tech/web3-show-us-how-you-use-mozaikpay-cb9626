version: '3.8'

services:
  mozaikflow-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaikflow_payroll_worker
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=MzkF1ow111111111111111111111111111111111111
      - KEEPER_KEYPAIR_PATH=/usr/src/app/keys/keeper.json
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - POLL_INTERVAL_MS=30000
    volumes:
      - ./keys:/usr/src/app/keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Worker Active')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"