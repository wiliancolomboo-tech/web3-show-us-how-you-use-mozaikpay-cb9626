version: '3.8'

services:
  mozaik-ase-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaik_ase_engine
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MOZAIK_API_KEY=${MOZAIK_API_KEY:-mozaik_live_sec_prod}
      - MOZAIK_WEBHOOK_SECRET=${MOZAIK_WEBHOOK_SECRET:-whsec_demo_secret_key_84920}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"