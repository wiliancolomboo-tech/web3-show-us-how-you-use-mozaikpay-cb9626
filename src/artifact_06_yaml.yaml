# docker-compose.yml
version: "3.8"

services:
  flowguard-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaikpay-flowguard-engine
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=MzkPayFLowGuard11111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3