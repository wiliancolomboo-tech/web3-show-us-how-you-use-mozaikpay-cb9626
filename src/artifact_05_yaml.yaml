# File: docker-compose.yml
version: "3.9"

services:
  mozaik-pulse-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaik-pulse-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - MOZAIK_WEBHOOK_SECRET=your_mozaik_webhook_secret_here
      - RESEND_API_KEY=re_dummy_sample_key_placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - REDIS_URL=redis://cache:6379
    depends_on:
      cache:
        condition: service_healthy

  cache:
    image: redis:7.2-alpine
    container_name: mozaik-pulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5