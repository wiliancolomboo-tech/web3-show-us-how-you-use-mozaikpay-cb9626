version: "3.8"

services:
  mozaikflow-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaikflow-gateway
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - SOLANA_CLUSTER=${SOLANA_CLUSTER:-devnet}
      - PROGRAM_ID=${PROGRAM_ID}
      - MERCHANT_PRIVATE_KEY=${MERCHANT_PRIVATE_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SUPPORT_EMAIL_FROM=${SUPPORT_EMAIL_FROM}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - USDC_MINT=${USDC_MINT}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3