version: '3.8'

services:
  mozaik-settlement-engine:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mozaik_settlement_engine
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=MoZ1kPayEngine111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY:-re_dummy_sample_key_placeholder}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3