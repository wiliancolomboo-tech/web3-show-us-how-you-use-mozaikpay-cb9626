[package]
name = "mozaik-pulse"
version = "0.1.0"
description = "MozaikPay Enterprise Streaming and Split-Settlement Engine"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mozaik_pulse"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1" }