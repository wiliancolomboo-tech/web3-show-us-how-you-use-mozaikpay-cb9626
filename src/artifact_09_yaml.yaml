version: "3.8"

services:
  mozaik-pulse-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mozaik-pulse-engine
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WSS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=MoZaiKP111111111111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=receipts@enterprise.mozaikpay.com
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ACCOUNTING_EMAIL=ledger-reconciliation@enterprise.com
      - PORT=8080
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"