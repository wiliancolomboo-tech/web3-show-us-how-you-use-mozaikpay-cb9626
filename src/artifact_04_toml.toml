[package]
name = "mozaik_flow"
version = "0.1.0"
description = "Enterprise Revenue Splitter & Metered Credit Billing for MozaikPay on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mozaik_flow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "mint"] }